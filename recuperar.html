<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Recuperar contraseña | TrumpeX</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at 75% 20%,#302519 0%,#101011 42%,#080809 85%);color:#f6f4ef;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;padding:22px}main{width:100%;max-width:450px;background:#141415;border:1px solid #5c4b31;border-radius:24px;padding:34px 30px;box-shadow:0 20px 65px #0009}.brand{font-size:24px;font-weight:800;letter-spacing:-.5px}.brand span{color:#d7b678}h1{font-size:27px;letter-spacing:-.8px;margin:30px 0 10px}p{line-height:1.55;color:#bdb9b1;font-size:15px}label{display:block;font-size:13px;font-weight:650;margin:22px 0 8px}input{width:100%;padding:14px 15px;background:#09090a;color:#fff;border:1px solid #5e574d;border-radius:12px;font-size:16px;outline:none}input:focus{border-color:#d7b678}button{width:100%;margin-top:22px;padding:14px;border:0;border-radius:12px;background:#d7b678;color:#14110d;font-weight:800;font-size:15px;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.status{margin-top:19px;line-height:1.5;font-size:14px;white-space:pre-line}.error{color:#ffaba6}.success{color:#b5edc0}a{color:#d7b678;text-decoration:none}.back{display:block;text-align:center;margin-top:26px;font-size:14px}#formulario{display:none}footer{margin-top:26px;text-align:center;color:#807b73;font-size:12px}
</style>
</head>
<body>
<main>
<div class="brand">♫ Trumpe<span>X</span></div>
<h1>Recuperar contraseña</h1>
<p id="instrucciones">Estamos verificando tu enlace de recuperación…</p>
<form id="formulario" autocomplete="off">
<label for="clave">Nueva contraseña</label>
<input id="clave" type="password" minlength="6" autocomplete="new-password" required placeholder="Mínimo 6 caracteres">
<label for="confirmacion">Confirmar contraseña</label>
<input id="confirmacion" type="password" minlength="6" autocomplete="new-password" required placeholder="Repetí la contraseña">
<button id="guardar" type="submit">GUARDAR NUEVA CONTRASEÑA</button>
</form>
<div id="estado" class="status" role="status" aria-live="polite"></div>
<a class="back" href="./">← Volver a TrumpeX</a>
<footer>TrumpeX · Seguridad de la cuenta</footer>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(async()=>{
'use strict';
const instrucciones=document.getElementById('instrucciones');
const formulario=document.getElementById('formulario');
const estado=document.getElementById('estado');
const boton=document.getElementById('guardar');
const query=new URLSearchParams(location.search);
const fragment=new URLSearchParams(location.hash.slice(1));
const error=query.get('error_description')||fragment.get('error_description')||query.get('error')||fragment.get('error');
const tipo=fragment.get('type')||query.get('type');
const tieneTokens=fragment.has('access_token')&&fragment.has('refresh_token');
const tieneCodigo=query.has('code');
const esRecuperacion=tipo==='recovery';
const mostrarError=(msg)=>{instrucciones.textContent='No pudimos validar el enlace.';estado.textContent=msg;estado.className='status error';formulario.style.display='none'};
if(error){mostrarError('El enlace es inválido, ya fue utilizado o venció. Solicitá uno nuevo desde la aplicación TrumpeX.');history.replaceState(null,'',location.pathname);return}
if(!esRecuperacion&&!tieneCodigo){mostrarError('Abrí esta página desde el correo de recuperación enviado por TrumpeX.');return}
if(!window.supabase?.createClient){mostrarError('No se pudo cargar la conexión segura. Revisá Internet y actualizá la página.');return}
const cliente=window.supabase.createClient('https://jqfcnsgyufowhfrvikrl.supabase.co','sb_publishable_g6FGhOwttxj7MAGBACMTKg_Z3lGf1zb',{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
try{
  if(tieneTokens&&esRecuperacion){
    const {error:e}=await cliente.auth.setSession({access_token:fragment.get('access_token'),refresh_token:fragment.get('refresh_token')});
    if(e)throw e;
  }else if(tieneCodigo){
    throw new Error('El enlace se generó con un flujo PKCE que no puede completarse en este navegador. Solicitá uno nuevo desde la versión corregida de TrumpeX.');
  }else{
    throw new Error('Falta una sesión de recuperación válida.');
  }
  history.replaceState(null,'',location.pathname);
  const {data:{session},error:e}=await cliente.auth.getSession();
  if(e||!session)throw e||new Error('Sesión no disponible');
  instrucciones.textContent='Elegí una contraseña nueva para tu cuenta de TrumpeX.';
  formulario.style.display='block';
  formulario.addEventListener('submit',async(ev)=>{
    ev.preventDefault();
    const clave=document.getElementById('clave').value;
    const confirmacion=document.getElementById('confirmacion').value;
    estado.textContent='';
    if(clave.length<6){estado.textContent='La contraseña debe tener al menos 6 caracteres.';estado.className='status error';return}
    if(clave!==confirmacion){estado.textContent='Las contraseñas no coinciden.';estado.className='status error';return}
    boton.disabled=true;
    try{
      const {error:e}=await cliente.auth.updateUser({password:clave});
      if(e)throw e;
      formulario.style.display='none';
      instrucciones.textContent='Tu contraseña se actualizó correctamente.';
      estado.textContent='Ya podés volver a la aplicación e iniciar sesión con tu nueva contraseña.';
      estado.className='status success';
      await cliente.auth.signOut({scope:'local'});
    }catch(e){estado.textContent='No se pudo actualizar la contraseña. El enlace puede haber vencido. Solicitá otro desde TrumpeX.';estado.className='status error';boton.disabled=false}
  });
}catch(e){history.replaceState(null,'',location.pathname);mostrarError(e?.message?.includes('PKCE') ? e.message : 'El enlace no pudo verificarse o ya venció. Solicitá uno nuevo desde TrumpeX.')}
})();
</script>
</body>
</html>
